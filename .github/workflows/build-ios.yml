name: Build iOS IPA (Free Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Target'
        required: true
        default: 'development'
        type: choice
        options:
          - 'development'
          - 'release'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: ⚙️ Setup Expo CLI
        run: npm install -g eas-cli

      - name: 📱 Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS App (${{ github.event.inputs.build_type }})
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Detected scheme: $SCHEME_NAME"

          if [ "${{ github.event.inputs.build_type }}" = "development" ]; then
            CONFIG="Debug"
            IPA_NAME="tunes-dev.ipa"
          else
            CONFIG="Release"
            IPA_NAME="tunes-native.ipa"
          fi

          echo "Building configuration: $CONFIG"

          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          cd ..
          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          cp -r ios/build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r "$IPA_NAME" Payload

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type == 'development' && 'tunes-dev-ipa' || 'tunes-native-ipa' }}
          path: ${{ github.event.inputs.build_type == 'development' && 'tunes-dev.ipa' || 'tunes-native.ipa' }}
          retention-days: 3